body {

background-image:

font-family: var(–body);
color: var(–text);
min-height: 100vh;
}

/* PIXEL GRID OVERLAY */
body::before {

position: fixed;
inset: 0;
background-image:

background-size: 32px 32px;
pointer-events: none;
z-index: 0;
}

.container { max-width: 1100px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

/* ===== HEADER ===== */
header {
text-align: center;
padding: 48px 20px 32px;
position: relative;
}

.pixel-badge {
display: inline-block;
background: var(–green);
color: #fff;
font-family: var(–pixel);
font-size: 8px;
padding: 6px 14px;
letter-spacing: 1px;
margin-bottom: 20px;
border-bottom: 4px solid var(–dark-green);
animation: blink 2s infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.6} }

h1 {
font-family: var(–pixel);
font-size: clamp(14px, 3vw, 22px);
color: var(–bright-green);
line-height: 1.6;
text-shadow: 4px 4px 0 var(–dark-green), 2px 2px 0 #000;
margin-bottom: 16px;
animation: fadeDown 0.6s ease both;
}

.subtitle {
font-size: 16px;
color: var(–muted);
max-width: 600px;
margin: 0 auto 8px;
font-weight: 600;
animation: fadeDown 0.8s ease both;
}

.stat-bar {
display: flex;
justify-content: center;
gap: 24px;
margin-top: 28px;
flex-wrap: wrap;
animation: fadeDown 1s ease both;
}

.stat-chip {
background: var(–panel);
border: 2px solid var(–green);
border-radius: 4px;
padding: 8px 18px;
font-family: var(–pixel);
font-size: 7px;
color: var(–bright-green);
line-height: 1.8;
text-align: center;
}

.stat-chip span { display: block; color: var(–gold); font-size: 10px; margin-top: 4px; }

/* ===== NAV TABS ===== */
.tabs {
display: flex;
gap: 4px;
margin: 32px 0 0;
flex-wrap: wrap;
justify-content: center;
}

.tab-btn {
background: var(–panel);
border: 2px solid #2a3d54;
color: var(–muted);
font-family: var(–pixel);
font-size: 7px;
padding: 10px 14px;
cursor: pointer;
transition: all 0.15s;
border-radius: 4px 4px 0 0;
letter-spacing: 0.5px;
}

.tab-btn:hover { background: #243548; color: var(–text); }
.tab-btn.active {
background: var(–green);
border-color: var(–bright-green);
color: #fff;
border-bottom-color: var(–green);
}

/* ===== PANELS ===== */
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeDown { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:none} }

.panel {

border: 2px solid #2a3d54;
border-radius: 0 8px 8px 8px;
padding: 28px;
margin-bottom: 20px;
}
